name: Documentation audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Validate V4 documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run V4 audit with repository-specific boundary
        env:
          REPO_NAME: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$REPO_NAME" == "rohanrm/rohan-home-lab-blueprint" ]]; then
            python3 tools/audit-v4.py . --private
          else
            python3 tools/audit-v4.py .
          fi
      - name: Validate Markdown configuration
        run: python3 -m json.tool .markdownlint.json >/dev/null
      - name: Check whitespace
        run: git diff-tree --check HEAD
