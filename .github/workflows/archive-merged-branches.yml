name: Archive merged documentation branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/archive-merged-branches.yml]

permissions:
  contents: read

jobs:
  archive:
    if: github.repository == 'rohanrm/rohan-home-lab-portfolio'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Archive verified branch tips and remove merged branches
        shell: bash
        run: |
          bash .github/scripts/archive-merged-branches.sh \
            docs-v4-redesign=ef1f359db2036b1871bee3c9c930cce55a9d503f=archive/docs-v4-redesign-2026-10-02
