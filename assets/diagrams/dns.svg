<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
<title id="title">Two resolvers. One clear policy.</title><desc id="desc">Clients can query either endpoint; each filters locally and resolves allowed names upstream.. Role-based illustration · production identifiers omitted.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08131f"/><stop offset="1" stop-color="#142640"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#acbdce"/></marker></defs>
<rect width="1200" height="690" rx="20" fill="url(#bg)"/>
<text x="44" y="45" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="600" fill="#43dfc1">ROHAN MENON / HOME LAB V4</text>
<text x="44" y="92" font-family="DejaVu Sans,Arial,sans-serif" font-size="32" font-weight="600" fill="#f0f6ff">Two resolvers. One clear policy.</text>
<text x="44" y="126" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#acbdce">Clients can query either endpoint; each filters locally and resolves allowed names upstream.</text>
<rect x="44" y="180" width="330" height="140" rx="14" fill="#132238" stroke="#29405c"/><rect x="44" y="196" width="4" height="108" rx="2" fill="#78b5ff"/><text x="64" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#78b5ff">REQUEST</text><text x="64" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#f0f6ff">Authorized client</text><text x="64" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">DHCP from Flint</text><text x="64" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">Two approved DNS endpoints</text><rect x="455" y="180" width="320" height="140" rx="14" fill="#132238" stroke="#29405c"/><rect x="455" y="196" width="4" height="108" rx="2" fill="#43dfc1"/><text x="475" y="210" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#43dfc1">LXC</text><text x="475" y="238" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#f0f6ff">Primary Pi-hole</text><text x="475" y="265" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">Virtualized resolver</text><text x="475" y="289" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">Independent query processing</text><rect x="455" y="400" width="320" height="140" rx="14" fill="#132238" stroke="#29405c"/><rect x="455" y="416" width="4" height="108" rx="2" fill="#ffc18a"/><text x="475" y="430" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffc18a">PHYSICAL</text><text x="475" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#f0f6ff">Secondary Pi-hole</text><text x="475" y="485" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">Physical resolver</text><text x="475" y="509" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">Outside Proxmox</text><rect x="856" y="289" width="300" height="145" rx="14" fill="#132238" stroke="#29405c"/><rect x="856" y="305" width="4" height="113" rx="2" fill="#bd9aff"/><text x="876" y="319" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="600" fill="#bd9aff">RESOLUTION</text><text x="876" y="347" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="600" fill="#f0f6ff">Upstream DNS</text><text x="876" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">Allowed queries</text><text x="876" y="398" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400" fill="#acbdce">Replies to allowed lookups</text><polyline points="374,250 455,250" fill="none" stroke="#acbdce" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="374,250 410,250 410,470 455,470" fill="none" stroke="#acbdce" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="775,250 815,250 815,337 856,337" fill="none" stroke="#acbdce" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><polyline points="775,470 815,470 815,386 856,386" fill="none" stroke="#acbdce" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="44" y="602" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="400" fill="#acbdce">Two advertised resolvers ≠ strict failover order or automatic configuration synchronization.</text>
